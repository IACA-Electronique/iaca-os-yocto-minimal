  /home/user/projects/iaca-os-yocto-minimal/layers/meta-raspberry \
  /home/user/projects/iaca-os-yocto-minimal/layers/meta-openembedded/meta-oe \
  /home/user/projects/iaca-os-yocto-minimal/layers/meta-fastboot \
  /home/user/projects/iaca-os-yocto-minimal/layers/meta-hello \
  /home/user/projects/iaca-os-yocto-minimal-securised/layers/meta-custom \
  "
