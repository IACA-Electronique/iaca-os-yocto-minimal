# ---------------------------------------------------------------
# Fast-boot kernel configuration fragment (Raspberry Pi / Yocto)
# Applied via merge_config.sh through SRC_URI in the .bbappend
# ---------------------------------------------------------------

CONFIG_LOCALVERSION="-fastboot"

# --- Trim kernel size / debug ---------------------------------
# Keep KALLSYMS=y: many subsystems (BPF, ftrace, oops) rely on it.
CONFIG_KALLSYMS=y
# DEBUG_INFO is a choice group on recent kernels:
CONFIG_DEBUG_INFO_NONE=y
# CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT is not set
# CONFIG_DEBUG_KERNEL is not set
# CONFIG_MAGIC_SYSRQ is not set
# CONFIG_PRINTK_TIME is not set
# CONFIG_DEBUG_BUGVERBOSE is not set
# CONFIG_FTRACE is not set
# CONFIG_KPROBES is not set
# CONFIG_PROFILING is not set

# --- Modules ---------------------------------------------------
# WARNING: keep modules enabled on RPi unless you *know* you have
# built every needed driver (WiFi/BT/VC4/camera) into the kernel.
CONFIG_MODULES=y
# CONFIG_MODVERSIONS is not set
# CONFIG_MODULE_UNLOAD is not set

# --- Filesystems (build-in what you boot from) -----------------
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
# CONFIG_XFS_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_F2FS_FS is not set
# CONFIG_REISERFS_FS is not set

# --- Scheduler / timer -----------------------------------------
# Preemption is a choice: pick exactly one.
CONFIG_PREEMPT_NONE=y
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT is not set

# HZ is a choice: pick exactly one.
CONFIG_HZ_100=y
# CONFIG_HZ_250 is not set
# CONFIG_HZ_1000 is not set
CONFIG_HZ=100

CONFIG_NO_HZ_IDLE=y
CONFIG_CPU_IDLE=y

# --- Security / audit (drop what you don't need) ---------------
# CONFIG_SELINUX is not set
# CONFIG_AUDIT is not set
# CONFIG_ACPI_DEBUG is not set

# --- Kernel image compression ----------------------------------
# gzip is natively understood by the RPi firmware & is a good
# balance between decompression time and image size on SD cards.
CONFIG_KERNEL_GZIP=y
# CONFIG_KERNEL_XZ is not set
# CONFIG_KERNEL_ZSTD is not set

# --- Kexec / crashdump not needed for embedded product ---------
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set
# CONFIG_CRASH_DUMP is not set

# --- Initramfs (only meaningful if one is embedded) ------------
# Leave the following ONLY if you actually embed an initramfs.
# CONFIG_BLK_DEV_INITRD is not set

# --- BOOTING TIME LOG ---
CONFIG_PRINTK=y
CONFIG_KALLSYMS=y